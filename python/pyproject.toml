[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qp-research"
version = "0.1.0"
description = "Research tooling for quant-platform"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "matplotlib", "nbconvert", "ipykernel"]

[project.optional-dependencies]
test = ["pytest", "statsmodels"]

[tool.setuptools.packages.find]
include = ["qp_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: streams from the live archive, run with -m network"]
addopts = "-m 'not network'"
